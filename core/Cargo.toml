[package]
name = "open-oswst-core"
version = "0.1.0"
edition = "2021"
description = "Hardware-free radio app: protocol, codec, menus, logging, device interfaces"

[dependencies]
log = "0.4"
embassy-sync = "0.7"
embassy-time = "0.5" # no time driver here: the firmware and desktop each bring one
embassy-futures = "0.1"
embedded-graphics = "0.8"
heapless = "0.8"
codec2 = "0.3.0"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
snow = { version = "0.10", default-features = false }

[dev-dependencies]
# The embassy channels need a critical-section implementation to link. The
# firmware's comes from esp-idf-svc, the desktop's from this.
critical-section = { version = "1", features = ["std"] }
snow = "0.10"

# Its own workspace, so `cd core && cargo test` runs the tests on this PC. The
# firmware and desktop use it by path.
[workspace]

# The FEC comparison: `cargo run --release --example fec_sim`. Its LoRa modem
# tests run with `cargo test`
[[example]]
name = "fec_sim"
test = true
