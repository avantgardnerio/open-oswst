[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "The management server radios dial out to (issue #34): firmware updates, then anything else"

[dependencies]
open-oswst-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
