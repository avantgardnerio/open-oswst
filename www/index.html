<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open OSWST radio</title>
  <link rel="stylesheet" href="style.css">
  <!-- The libraries, served by the radio itself: nothing needs the
       internet. These node_modules files (package.json) are the only ones
       that go to the radio: the scripts copy what this map names -->
  <script type="importmap">
  {
    "imports": {
      "preact": "./node_modules/preact/dist/preact.mjs",
      "preact/hooks": "./node_modules/preact/hooks/dist/hooks.mjs",
      "htm": "./node_modules/htm/dist/htm.mjs",
      "htm/preact": "./node_modules/htm/preact/index.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
