[package]
name = "open-oswst"
version = "0.1.0"
authors = ["Brent Gardner <bgardner@squarelabs.net>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "open-oswst"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "s"
lto = "thin"

[dependencies]
# The app itself: hardware-free, shared with the desktop simulator
open-oswst-core = { path = "core" }
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-futures = "0.1"
embassy-sync = "0.7"
# Our fork (avantgardnerio/lora-rs), branch lora-phy-3.0.2-alpha: fixes we mean
# to upstream. To work on it, point this at a local checkout
# (path = "../lora-rs/lora-phy"); tag the fork and switch back before pushing
lora-phy = { git = "https://github.com/avantgardnerio/lora-rs", tag = "lora-phy-v3.0.2-alpha-oswst.1" }
ssd1306 = "0.9"
embedded-graphics = "0.8"
heapless = "0.8"
# Settings file (/data/config.toml)
toml = "0.8"
# Errors in the HTTP handlers (http.rs)
anyhow = "1"
# The traits lora-phy talks to hardware through; radio_timing wraps them to time each call
embedded-hal = "1"
embedded-hal-async = "1"
codec2 = "0.3.0"

# LittleFS for the `storage` partition (see partitions.csv). esp-idf-sys already
# generates its bindings once the component is present.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "joltwallet/littlefs", version = "1" }

# mDNS, so each radio answers as oswst-XXXX.local (net.rs)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1" }

[build-dependencies]
embuild = "0.33"
